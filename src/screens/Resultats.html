```html
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mes recettes - Ma Petite Assiette</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body>

<div class="screen">


    <!-- =========================
         EN-TÊTE
    ========================== -->

    <header class="page-header">

        <h1>
            ✨ Mes recettes pour vous
        </h1>

        <p class="page-subtitle">
            Des recettes qui correspondent à vos envies
        </p>

    </header>


    <!-- =========================
         RÉSUMÉ DES CHOIX
    ========================== -->

    <section class="results-summary">

        <p id="resumeChoix">
            Recherche de vos recettes...
        </p>

    </section>


    <!-- =========================
         RÉSULTATS
    ========================== -->

    <main>

        <section
            id="liste-resultats"
            class="recipe-results">

            <p>
                Recherche des recettes...
            </p>

        </section>

    </main>


    <!-- =========================
         RETOUR
    ========================== -->

    <div class="back-button">

        <a
            href="MesEnvies.html"
            class="button">

            ← Modifier mes envies

        </a>

    </div>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="navbar">

        <a
            href="Accueil.html"
            class="nav-item">

            🏠
            <span>Accueil</span>

        </a>


        <a
            href="MesEnvies.html"
            class="nav-item active">

            🔍
            <span>Envies</span>

        </a>


        <a
            href="Recettes.html"
            class="nav-item">

            🍽️
            <span>Recettes</span>

        </a>


        <a
            href="Favoris.html"
            class="nav-item">

            ⭐
            <span>Favoris</span>

        </a>


        <a
            href="MonProfil.html"
            class="nav-item">

            👤
            <span>Profil</span>

        </a>

    </nav>


</div>



<script>


/* =========================
   INITIALISATION
========================= */

document.addEventListener(
    "DOMContentLoaded",
    afficherResultats
);



/* =========================
   AFFICHAGE DES RÉSULTATS
========================= */

async function afficherResultats() {


    const container =
        document.getElementById(
            "liste-resultats"
        );


    const resume =
        document.getElementById(
            "resumeChoix"
        );


    /*
     * Récupération des choix
     */

    const envie =
        localStorage.getItem("envie");


    const temps =
        localStorage.getItem("temps");


    const preferences =
        JSON.parse(
            localStorage.getItem("preferences")
        ) || [];


    /*
     * Traduction des envies
     */

    const nomsEnvies = {

        leger:
            "Léger",

        complet:
            "Un plat complet",

        rapide:
            "Rapide",

        sucre:
            "Sucré",

        reconfort:
            "Réconfortant",

        vegetarien:
            "Végétarien"

    };


    const nomEnvie =
        nomsEnvies[envie] ||
        "Votre envie";


    /*
     * Traduction du temps
     */

    let texteTemps;


    if (temps === "10") {

        texteTemps = "10 minutes";

    }

    else if (temps === "20") {

        texteTemps = "20 minutes";

    }

    else if (temps === "30") {

        texteTemps = "30 minutes";

    }

    else {

        texteTemps =
            "sans limite de temps";

    }


    /*
     * Résumé
     */

    resume.innerHTML = `

        Vous recherchez quelque chose de
        <strong>${nomEnvie}</strong>,
        réalisable en
        <strong>${texteTemps}</strong>.

    `;


    /*
     * Chargement du JSON
     */

    try {


        const response =
            await fetch("../recettes.json");


        if (!response.ok) {

            throw new Error(
                "Impossible de charger recettes.json"
            );

        }


        const recettes =
            await response.json();


        /*
         * FILTRAGE
         *
         * On commence par le temps
         * et les caractéristiques principales.
         */

        let resultats =
            recettes.filter(recette => {


                /* =========================
                   TEMPS
                ========================= */

                let correspondTemps = true;


                if (
                    temps &&
                    temps !== "plus"
                ) {

                    correspondTemps =
                        Number(recette.temps)
                        <=
                        Number(temps);

                }


                if (!correspondTemps) {

                    return false;

                }


                /* =========================
                   PETITE PORTION
                ========================= */

                if (
                    preferences.includes("petite") &&
                    recette.petitAppetit !== true
                ) {

                    return false;

                }


                /* =========================
                   VÉGÉTARIEN
                ========================= */

                if (
                    envie === "vegetarien" &&
                    recette.vegetarien !== true
                ) {

                    return false;

                }


                /* =========================
                   ENVIES
                ========================= */

                if (envie === "leger") {

                    if (
                        !recette.envies.includes(
                            "leger"
                        )
                    ) {

                        return false;

                    }

                }


                if (envie === "rapide") {

                    if (
                        !recette.envies.includes(
                            "rapide"
                        )
                    ) {

                        return false;

                    }

                }


                if (envie === "reconfort") {

                    if (
                        !recette.envies.includes(
                            "reconfortant"
                        )
                    ) {

                        return false;

                    }

                }


                /*
                 * UN PLAT COMPLET
                 *
                 * On privilégie les recettes
                 * contenant une protéine.
                 */

                if (envie === "complet") {

                    if (
                        !recette.envies.includes(
                            "proteine"
                        )
                    ) {

                        return false;

                    }

                }


                /*
                 * SUCRÉ
                 *
                 * Pour l'instant, ton JSON ne contient
                 * pas encore de recettes sucrées.
                 *
                 * On ne bloque donc pas les résultats.
                 */

                if (envie === "sucre") {

                    return true;

                }


                return true;

            });


        /*
         * =========================
         * SI AUCUN RÉSULTAT
         * =========================
         */

        if (
            resultats.length === 0
        ) {

            /*
             * On fait une deuxième recherche
             * plus souple uniquement sur le temps.
             *
             * Cela évite de laisser l'utilisateur
             * devant une page vide.
             */

            resultats =
                recettes.filter(
                    recette => {

                        if (
                            !temps ||
                            temps === "plus"
                        ) {

                            return true;

                        }

                        return (
                            Number(recette.temps)
                            <=
                            Number(temps)
                        );

                    }
                );


            /*
             * On limite le message si vraiment
             * aucune recette n'existe.
             */

            if (
                resultats.length === 0
            ) {

                container.innerHTML = `

                    <div class="no-results">

                        <h2>
                            😕 Aucune recette trouvée
                        </h2>

                        <p>
                            Essayez de modifier
                            vos critères.
                        </p>

                        <a
                            href="MesEnvies.html"
                            class="button">

                            Modifier mes envies

                        </a>

                    </div>

                `;

                return;

            }

        }


        /*
         * =========================
         * AFFICHAGE
         * =========================
         */

        container.innerHTML = "";


        resultats.forEach(
            recette => {


                const card =
                    document.createElement("a");


                card.className =
                    "recipe-result-card";


                card.href =
                    `Recette.html?id=${recette.id}`;


                card.innerHTML = `

                    <div class="recipe-result-icon">
                        🍽️
                    </div>


                    <div class="recipe-result-content">

                        <h2>
                            ${recette.nom}
                        </h2>

                        <p>
                            ⏱️ ${recette.temps} min
                        </p>

                        <p>
                            🥩 ${recette.proteines}
                            g de protéines
                        </p>

                        <p>
                            🥄 Petite portion
                        </p>

                        <p>
                            🍴 ${recette.texture}
                        </p>

                    </div>


                    <div class="recipe-result-arrow">
                        →
                    </div>

                `;


                container.appendChild(card);

            }
        );


    }


    catch (error) {


        console.error(error);


        container.innerHTML = `

            <div class="no-results">

                <h2>
                    ⚠️ Une erreur est survenue
                </h2>

                <p>
                    Impossible de charger
                    les recettes.
                </p>

            </div>

        `;

    }

}


</script>


</body>

</html>
```
