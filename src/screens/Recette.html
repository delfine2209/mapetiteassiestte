     JAVASCRIPT

<script>

document.addEventListener(
    "DOMContentLoaded",
    afficherRecette
);


async function afficherRecette() {

    const fiche =
        document.getElementById("fiche-recette");

    const titre =
        document.getElementById("nom-recette");


    /*
     * Récupération de l'ID
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const id =
        params.get("id");


    /*
     * Vérification
     */

    if (!id) {

        fiche.innerHTML = `

            <div class="no-results">

                <h2>
                    😕 Recette introuvable
                </h2>

                <p>
                    Aucune recette n'a été sélectionnée.
                </p>

                <a
                    href="Recettes.html"
                    class="button">

                    Voir les recettes

                </a>

            </div>

        `;

        return;

    }


    /*
     * Chargement du fichier JSON
     */

    try {

        const response =
            await fetch("../recettes.json");


        if (!response.ok) {

            throw new Error(
                "Impossible de charger les recettes."
            );

        }


        const recettes =
            await response.json();


        /*
         * Recherche de la recette
         */

        const recette =
            recettes.find(
                r => r.id === id
            );


        /*
         * Recette inexistante
         */

        if (!recette) {

            titre.textContent =
                "Recette introuvable";


            fiche.innerHTML = `

                <div class="no-results">

                    <h2>
                        😕 Cette recette n'existe pas
                    </h2>

                    <p>
                        L'identifiant ${id}
                        ne correspond à aucune recette.
                    </p>

                    <a
                        href="Recettes.html"
                        class="button">

                        Voir les recettes

                    </a>

                </div>

            `;

            return;

        }


        /*
         * Titre
         */

        titre.textContent =
            recette.nom;


        /*
         * Construction des caractéristiques
         */

        let caracteristiques = "";


        if (recette.petitAppetit) {

            caracteristiques += `
                <span class="tag">
                    🥄 Petite portion
                </span>
            `;

        }


        if (recette.preOperatoire) {

            caracteristiques += `
                <span class="tag">
                    🩺 Pré-opératoire
                </span>
            `;

        }


        if (recette.postOperatoire) {

            caracteristiques += `
                <span class="tag">
                    🩺 Post-opératoire
                </span>
            `;

        }


        if (recette.vegetarien) {

            caracteristiques += `
                <span class="tag">
                    🌱 Végétarien
                </span>
            `;

        }


        if (recette.vegetalien) {

            caracteristiques += `
                <span class="tag">
                    🌱 Végétalien
                </span>
            `;

        }


        if (recette.sansGluten) {

            caracteristiques += `
                <span class="tag">
                    🌾 Sans gluten
                </span>
            `;

        }


        if (recette.sansLactose) {

            caracteristiques += `
                <span class="tag">
                    🥛 Sans lactose
                </span>
            `;

        }


        /*
         * Affichage de la fiche
         */

        fiche.innerHTML = `

            <section class="recipe-detail">


                <div class="recipe-detail-icon">
                    🍽️
                </div>


                <h2>
                    ${recette.nom}
                </h2>


                <p class="recipe-category">
                    ${recette.categorie}
                </p>


                <div class="recipe-infos">


                    <div class="recipe-info">

                        <span>
                            ⏱️
                        </span>

                        <strong>
                            ${recette.temps} min
                        </strong>

                        <small>
                            Temps
                        </small>

                    </div>


                    <div class="recipe-info">

                        <span>
                            🥩
                        </span>

                        <strong>
                            ${recette.proteines} g
                        </strong>

                        <small>
                            Protéines
                        </small>

                    </div>


                    <div class="recipe-info">

                        <span>
                            🍴
                        </span>

                        <strong>
                            ${recette.texture}
                        </strong>

                        <small>
                            Texture
                        </small>

                    </div>


                </div>


                <section class="recipe-tags">

                    <h3>
                        Cette recette vous correspond
                    </h3>

                    <div class="tags">

                        ${caracteristiques}

                    </div>

                </section>


                <section class="recipe-actions">

                    <button
                        class="button button-main"
                        onclick="ajouterFavori('${recette.id}')">

                        ❤️ Ajouter aux favoris

                    </button>

                </section>


            </section>

        `;

    }

    catch (error) {

        console.error(error);


        fiche.innerHTML = `

            <div class="no-results">

                <h2>
                    ⚠️ Une erreur est survenue
                </h2>

                <p>
                    Impossible de charger cette recette.
                </p>

            </div>

        `;

    }

}



/* =========================
   FAVORIS
========================= */

function ajouterFavori(id) {

    let favoris =
        JSON.parse(
            localStorage.getItem("favoris")
        ) || [];


    if (!favoris.includes(id)) {

        favoris.push(id);

        localStorage.setItem(
            "favoris",
            JSON.stringify(favoris)
        );

        alert(
            "❤️ Recette ajoutée à vos favoris !"
        );

    }

    else {

        alert(
            "Cette recette est déjà dans vos favoris ❤️"
        );

    }

}

</script>


</body>

</html>
